<text x="48" y="766" font-size="21" fill="#20392e" font-weight="bold" text-anchor="start">Joystick</text>
<text x="48" y="794" font-size="17" fill="#20392e" font-weight="normal" text-anchor="start">VCC → 5V     GND → GND</text>
<text x="48" y="820" font-size="17" fill="#20392e" font-weight="normal" text-anchor="start">VRx → A0      VRy → A1      SW → D2</text>
<text x="48" y="863" font-size="17" fill="#20392e" font-weight="normal" text-anchor="start">The A2 wire and 10 kΩ resistor share the photoresistor’s lower row.</text>
<text x="48" y="890" font-size="17" fill="#20392e" font-weight="normal" text-anchor="start">Use the − rail for ground. Resistors and photoresistors have no polarity.</text>
